x-ocr-app: &ocr-app
  image: ghcr.io/arun0009/ocr-tess4j-rest:latest
  build: .
  env_file:
    - .env

services:
  ocr:
    <<: *ocr-app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  mongo:
    profiles: [mongo]
    image: mongo:7
    ports:
      - "27017:27017"

  ocr-mongo:
    <<: *ocr-app
    profiles: [mongo]
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mongo
      MONGODB_URI: mongodb://mongo:27017/ocr
    depends_on:
      - mongo
