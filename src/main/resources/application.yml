spring:
  application:
    name: ocr-tess4j-rest
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.MongoDataAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.MongoRepositoriesAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mongodb:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ocr:
  language: eng
  data-path: ${TESSDATA_PREFIX:}
  page-seg-mode: 3
  ocr-engine-mode: 1
  max-upload-bytes: 10485760
  url-fetch:
    enabled: false
    allowed-hosts:
      - raw.githubusercontent.com
  storage:
    type: none
  cors:
    enabled: false

info:
  app:
    name: ocr-tess4j-rest
    version: 2.0.0

---
spring:
  config:
    activate:
      on-profile: mongo
  autoconfigure:
    exclude: []
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/ocr}

management.health.mongodb.enabled: true

ocr:
  storage:
    type: mongo
